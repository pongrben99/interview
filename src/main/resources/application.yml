# Common configuration. Profile-specific values live in application-<profile>.yml.
server:
  port: 8090                 # not Spring's usual 8080, which is often taken on developer machines

spring:
  application:
    name: alerting-service
  profiles:
    # `./gradlew bootRun` without a selected profile starts the zero-setup local profile.
    default: local
  threads:
    virtual:
      enabled: true          # blocking I/O in the channel adapters runs on virtual threads (docs/02, D-15)
  jackson:
    # A strict JSON contract: typos and wrong types are errors, not silently ignored or coerced.
    deserialization:
      fail-on-unknown-properties: true   # {"titel": ...} is a 400, not a missing title
      accept-float-as-int: false         # severity 4.9 is a 400, not a quiet 4
    mapper:
      allow-coercion-of-scalars: false   # "4" is not a number, 5 is not a text
  jpa:
    open-in-view: false      # no lazy loading in the web layer
    hibernate:
      ddl-auto: validate     # entity mappings must match the Flyway migrations
  flyway:
    locations: classpath:db/migration

management:
  server:
    # Actuator has its own internal port and is never routed by a public proxy (docs/03, P-03).
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness and /actuator/health/readiness
