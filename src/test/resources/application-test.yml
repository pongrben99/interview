# Extra settings for integration tests; activated together with the local profile.
spring:
  datasource:
    # A fresh, uniquely named in-memory database per Spring context keeps test classes isolated.
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1

management:
  server:
    port: 0                  # random free port, read back through local.management.port
